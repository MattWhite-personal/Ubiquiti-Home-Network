name: "UniFi backup tests"

on:
  push:
    paths:
      - "scripts/**"
      - "backup-infrastructure/**"
      - ".github/actions/unifi-backup/**"
      - ".github/workflows/unifi-backup*.yml"
      - ".github/workflows/backup-infrastructure.yml"
      - ".github/workflows/tf-plan-apply.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "backup-infrastructure/**"
      - ".github/actions/unifi-backup/**"
      - ".github/workflows/unifi-backup*.yml"
      - ".github/workflows/backup-infrastructure.yml"
      - ".github/workflows/tf-plan-apply.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test backup logic
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Validate backup infrastructure
        working-directory: backup-infrastructure
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
